name: Preview

# The site is served by GitHub Pages straight from main, so a preview that lives on the real domain
# has to live in main too. Every run here writes inside preview/ and nowhere else, which keeps the
# published site exactly as it is even when this workflow is wrong.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Each run commits to main, so they queue rather than race. Cleanup runs are worth waiting for.
concurrency:
  group: preview-publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    # A pull request from a fork cannot be handed a token that writes here.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PREVIEW_PATH: preview/pr-${{ github.event.number }}
    steps:
      - name: Check out the branch under review
        if: github.event.action != 'closed'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: branch

      - name: Check out what the site is serving
        uses: actions/checkout@v7
        with:
          ref: main
          path: site

      # The branch builds its own preview, so a change to how previews are built can be previewed.
      - name: Build the preview
        if: github.event.action != 'closed'
        run: |
          node branch/scripts/build-preview.mjs \
            --source branch \
            --out "site/$PREVIEW_PATH" \
            --base "/$PREVIEW_PATH/"

      - name: Take the preview down
        if: github.event.action == 'closed'
        run: rm -rf "site/$PREVIEW_PATH"

      - name: Publish
        id: publish
        working-directory: site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Staging only ever inside preview/, so nothing else can ride along into a commit.
          mkdir -p preview
          git add -A -- preview

          if git diff --cached --quiet; then
            echo "the preview is already up to date"
            exit 0
          fi

          if [ "${{ github.event.action }}" = "closed" ]; then
            git commit -m "Take down the preview for #${{ github.event.number }}"
          else
            git commit -m "Publish the preview for #${{ github.event.number }} at ${{ github.event.pull_request.head.sha }}"
          fi

          # Another pull request may have published between the checkout and now.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase origin main
            sleep $((attempt * 3))
          done

          echo "could not push after five attempts"
          exit 1

      # Pages rebuilds on its own schedule, so the comment below should not promise a URL early.
      - name: Wait for the preview to answer
        if: github.event.action != 'closed'
        continue-on-error: true
        run: |
          url="https://jackhone.com/$PREVIEW_PATH/"
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url" || true)
            if [ "$code" = "200" ]; then
              echo "$url is live"
              exit 0
            fi
            echo "waiting for $url (got $code)"
            sleep 10
          done
          echo "still not answering; Pages is probably still building"

      - name: Leave the link on the pull request
        if: github.event.action != 'closed'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- preview-url -->";
            const url = `https://jackhone.com/${process.env.PREVIEW_PATH}/`;
            const body = [
              marker,
              `**Preview:** ${url}`,
              "",
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. It carries no analytics and asks not to be indexed, and it goes away when this pull request closes.`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
